permissions:
  id-token: write # これが OIDC を使うために必須！
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ここが OIDC の魔法の部分
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsRole # 作ったロールのARN
          aws-region: ap-northeast-1

      # これ以降は今までと同じ（docker build, push など）
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        run: |
          docker build -t hello-world .
          docker tag hello-world:latest ${{ steps.login-ecr.outputs.registry }}/hello-world:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/hello-world:latest

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: task-definition.json
          service: hello-world-task-v2-service-fx1rm85e
          cluster: hello-world-cluster
