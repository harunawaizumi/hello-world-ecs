name: Deploy to Amazon ECS

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  # --- ジョブ1: テスト環境（Staging）へのデプロイ ---
  deploy-staging:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::785621645164:role/GitHubActionsRole
          aws-region: ap-northeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        run: |
          IMAGE_TAG=${{ github.sha }}
          REGISTRY=${{ steps.login-ecr.outputs.registry }}
          REPOSITORY=hellow-world
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          echo "image=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: hellow-world-v2
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to Staging (Test Environment)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          # 【重要】AWS側で作った「テスト用サービス」の名前をここに書く
          service: hello-world-staging-service 
          cluster: hello-world-cluster

  # --- ジョブ2: 本番環境（Production）へのデプロイ ---
  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging         # テスト環境のデプロイが終わるまで待つ
    environment: production       # GitHub上で「承認ボタン」が必要になる設定
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::785621645164:role/GitHubActionsRole
          aws-region: ap-northeast-1

      # テスト環境で使ったのと同じイメージを本番にも使う
      - name: Fill in the image ID
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: hellow-world-v2
          image: ${{ steps.login-ecr.outputs.registry }}/hellow-world:${{ github.sha }}

      - name: Deploy to Production
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          # 【重要】本番用サービスの名前
          service: hello-world-task-v2-service-fx1rm85e
          cluster: hello-world-cluster
